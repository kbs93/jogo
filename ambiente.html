<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emoji Math Snake - Protótipo Slither</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HUD superior com pontuação, recorde e botão de voltar -->
  <div id="hud">
    <span>PONTOS: <span id="pontosTxt">0</span> | RECORDE: <span id="recordeTxt">0</span></span>
    <button id="btnVoltarMenu" type="button" style="background: #172b3c; border: 1px solid #00e5ff66; color: #00e5ff; font-weight: bold; border-radius: 6px; padding: 5px 12px; cursor: pointer; margin-left: 14px;">MENU</button>
  </div>

  <!-- Caixa de texto acoplada à cabeça (centralizada) -->
  <div id="inputContainer">
    <span id="timerTxt">5</span>
    <input type="text" id="mathInput" placeholder="?" autocomplete="off" inputmode="numeric">
  </div>

  <!-- Tela de Derrota com opção de reiniciar ou voltar ao perfil -->
  <div id="gameOverModal">
    <h1>GAME OVER</h1>
    <p>Pontuação: <span id="pontosFinalTxt">0</span></p>
    <p style="font-size: 16px; color: #f5d442;">Melhor Recorde: <span id="recordeFinalTxt">0</span></p>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="btnReiniciar">JOGAR NOVAMENTE</button>
      <button id="btnVoltarMenuGO" style="background: #101c2a; border: 1px solid #00e5ff; color: #00e5ff; font-weight: bold; border-radius: 6px; padding: 11px 20px; cursor: pointer;">PERFIL</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Ligação modular ES6 -->
  <script type="module" src="js/ambiente.js"></script>
</body>
</html>
